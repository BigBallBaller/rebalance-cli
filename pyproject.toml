
[project]

name = "rebalance-cli"

version = "0.1.0"

description = "A portfolio rebalancing CLI that generates buy/sell trades to reach target weights."

readme = "README.md"

requires-python = ">=3.10"

dependencies = [
  "pandas>=2.0",
  "typer>=0.12",
  "rich>=13.0"
]

[project.scripts]

rebalance = "rebalance.cli:app"

